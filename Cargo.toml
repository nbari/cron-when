[package]
name = "cron-when"
version = "0.2.0"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "A CLI tool to parse cron expressions and display next execution times with human-readable durations"
documentation = "https://docs.rs/cron-when/latest/cron_when/"
repository = "https://github.com/nbari/cron-when"
readme = "README.md"
keywords = ["cron", "crontab", "scheduler", "parser", "cli"]
categories = ["command-line-utilities", "date-and-time", "parser-implementations"]
license = "BSD-3-Clause"
edition = "2024"

[features]
default = []
musl = ["openssl/vendored"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
colored = "3"
compound_duration = "2"
cron-parser = "0.11"
once_cell = "1.21"
openssl = { version = "0.10", optional = true, features = ["vendored"] }
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "gzip-tonic", "tls", "tls-roots", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
tokio = { version = "1", features = ["rt", "macros"] }
tonic = { version = "0.14.2", features = ["tls-native-roots"] }
tracing = "0.1"
tracing-futures = "0.2.5"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
ulid = "1.2.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/cron-when", dest = "/usr/bin/cron-when", mode = "0755" },
]

[package.metadata.deb]
assets = [
  ["target/release/cron-when", "/usr/bin/cron-when", "755"],
]
depends = ""

[build-dependencies]
built = { version = "0.8.0", features = ["git2"] }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "parse_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
