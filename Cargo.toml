[package]
name = "cron-when"
version = "0.5.1"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "A CLI tool to parse cron expressions and display next execution times with human-readable durations"
documentation = "https://docs.rs/cron-when/latest/cron_when/"
repository = "https://github.com/nbari/cron-when"
readme = "README.md"
keywords = ["cron", "crontab", "scheduler", "parser", "cli"]
categories = ["command-line-utilities", "date-and-time", "parser-implementations"]
license = "BSD-3-Clause"
edition = "2024"

[lints.rust]
warnings = "deny"

[lints.clippy]
# Allow unstable/opinionated lints (lower priority so individual lints can override)
nursery = { level = "allow", priority = -1 }

# Enforce pedantic lints
pedantic = "deny"

# Core lint groups
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"

# Safety-critical lints
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"

# Performance + memory reliability
needless_borrow = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
colored = "3"
compound_duration = "2"
cron-parser = "0.11"
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic", "gzip-tonic", "tls", "tls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
tokio = { version = "1", features = ["rt", "macros"] }
tonic = { version = "0.14.5", features = ["tls-webpki-roots"] }
tracing = "0.1"
tracing-futures = "0.2.5"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "1.2.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/cron-when", dest = "/usr/bin/cron-when", mode = "0755" },
]

[package.metadata.deb]
assets = [
  ["target/release/cron-when", "/usr/bin/cron-when", "755"],
]
depends = ""

[build-dependencies]
built = { version = "0.8.0", features = ["git2"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "parse_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
