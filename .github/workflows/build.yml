---
name: Test & Build

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  security:
    uses: ./.github/workflows/security-audit.yml

  containers:
    uses: ./.github/workflows/containers.yml

  build:
    name: Build (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    needs:
      - test
      - containers

    strategy:
      matrix:
        include:
          - build: linux-default
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            feature-set: default
            image_arch: amd64

          - build: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            feature-set: default
            image_arch: arm64

          - build: linux-telemetry
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            feature-set: telemetry

          - build: macos-default
            os: macos-latest
            target: x86_64-apple-darwin
            feature-set: default

          - build: macos-telemetry
            os: macos-latest
            target: x86_64-apple-darwin
            feature-set: telemetry

          - build: windows-default
            os: windows-latest
            target: x86_64-pc-windows-msvc
            feature-set: default

          - build: windows-telemetry
            os: windows-latest
            target: x86_64-pc-windows-msvc
            feature-set: telemetry

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Cargo package information
        id: package
        uses: ./.github/actions/crate-info

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (musl)
        if: startsWith(matrix.build, 'linux-')
        run: sudo apt-get update -y && sudo apt-get install -y musl-dev musl-tools

      - name: Build (${{ matrix.feature-set }})
        if: matrix.feature-set == 'default'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (telemetry)
        if: matrix.feature-set == 'telemetry'
        run: cargo build --release --locked --target ${{ matrix.target }} --features telemetry

      - name: Build and test the runtime image
        if: matrix.image_arch != ''
        env:
          ARCH: ${{ matrix.image_arch }}
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/container/build-native.sh "$ARCH" "target/$TARGET/release/$PACKAGE" "$PACKAGE:ci"
          bash .github/container/smoke-test.sh "$PACKAGE:ci" "$VERSION"

      # Packaging is checked here too, so a broken RPM/DEB definition fails CI on
      # develop instead of the release.
      - name: Package RPM and DEB
        if: matrix.build == 'linux-default'
        uses: ./.github/actions/linux-packages
        with:
          target: ${{ matrix.target }}
          package: ${{ steps.package.outputs.name }}

  # The same crate checks the release runs, so a package crates.io would refuse (missing
  # metadata, unpublishable files) fails here on develop, not after the release tag exists.
  crate:
    name: Crate
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain

      - name: Package and verify the crate
        run: cargo package --locked

      - name: Check crates.io would accept it
        run: cargo publish --dry-run --locked

  # One aggregate check for branch protection and the release flow: it passes only
  # when every gating job succeeded, so the required check never depends on job or
  # matrix names. Coverage is reported, not a gate: an upload to a coverage service
  # failing must not block a release.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test
      - security
      - containers
      - build
      - crate
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done
