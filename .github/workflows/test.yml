---
name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

  check:
    name: Feature Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain

      - name: Check minimal feature set
        run: cargo check --locked

      - name: Check all features
        run: cargo check --all-features --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          MSRV=$(awk -F '"' '/^rust-version = / {print $2; exit}' Cargo.toml)
          test -n "$MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check all targets and features
        run: cargo check --all-targets --all-features --locked

  test:
    name: Test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        rust:
          - stable
    runs-on: ${{ matrix.os }}
    needs:
      - format
      - lint
      - check
      - msrv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain

      - name: Test minimal feature set
        run: cargo test --locked

      - name: Test all features
        run: cargo test --all-features --locked
