---
name: Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Classifies the run for the jobs below. `candidate` is a manual (workflow_dispatch)
  # run, which `just deploy` starts on the release candidate before any tag exists: it
  # runs the whole pipeline (tests, every build and package, a crates.io dry run) and
  # uploads the artifacts, but publishes nothing. `release` is an X.Y.Z tag: it builds
  # nothing and publishes the artifacts of the successful candidate run of the same
  # commit, so what ships is exactly what was tested and nothing that can fail is left
  # for after the tag. `test-tag` (other tags, e.g. t-* from `just t-deploy`) tests and
  # builds only. A release tag may only publish a commit that is on main, carries the
  # tag's version and passed both Test & Build and its candidate run; a hand-pushed or
  # stray tag stops here.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      version: ${{ steps.classify.outputs.version }}
      candidate_run: ${{ steps.release.outputs.candidate_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify the ref
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          kind=candidate
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            kind=test-tag
            version="${GITHUB_REF#refs/tags/}"
            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              kind=release
            fi
          fi
          {
            echo "kind=${kind}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Ref ${GITHUB_REF} classified as ${kind} (version ${version})."

      - name: Require the tagged commit to be on main and to have passed Test & Build and its candidate run
        id: release
        if: steps.classify.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${tag} points at ${GITHUB_SHA}, which is not on main; refusing to release."
            exit 1
          fi
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [[ "${version}" != "${tag}" ]]; then
            echo "::error::Tag ${tag} does not match the package version ${version} at ${GITHUB_SHA}; refusing to release."
            exit 1
          fi
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build.yml \
            --commit "${GITHUB_SHA}" --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${passed}" ]]; then
            echo "::error::${GITHUB_SHA} has no successful Test & Build run; refusing to release ${tag}."
            exit 1
          fi
          candidate_run="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow release.yml \
            --commit "${GITHUB_SHA}" --event workflow_dispatch --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${candidate_run}" ]]; then
            echo "::error::${GITHUB_SHA} has no successful candidate run of this workflow; refusing to publish untested artifacts."
            exit 1
          fi
          echo "candidate_run=${candidate_run}" >> "$GITHUB_OUTPUT"
          echo "Tag ${tag}: ${GITHUB_SHA} is on main, passed Test & Build (run ${passed}) and its candidate run ${candidate_run}."

  # A release tag reuses its candidate run's results, so it neither tests nor builds.
  test:
    needs: guard
    if: needs.guard.outputs.kind != 'release'
    uses: ./.github/workflows/test.yml

  containers:
    needs: guard
    if: needs.guard.outputs.kind != 'release'
    uses: ./.github/workflows/containers.yml

  build:
    name: Build and package
    runs-on: ${{ matrix.os }}
    needs:
      - guard
      - test
      - containers
    if: needs.guard.outputs.kind != 'release'

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get package name from Cargo.toml
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(awk -F '"' '/^name = / {print $2; exit}' Cargo.toml)
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Package name: $PACKAGE_NAME"

      - name: Get the release version from the guard
        run: echo "VERSION=${{ needs.guard.outputs.version }}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux-only prerequisites
      - name: Install system deps (musl)
        if: startsWith(matrix.build, 'linux')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-dev musl-tools

      - name: Install packaging tools (RPM/DEB)
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo install cargo-generate-rpm
          cargo install cargo-deb --force --locked

      # Build once for Linux (musl)
      - name: Build Linux (musl)
        if: startsWith(matrix.build, 'linux')
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Strip once and prep paths for both packagers
      - name: Strip and prepare packaging paths (Linux)
        if: startsWith(matrix.build, 'linux')
        run: |
          BIN="target/${{ matrix.target }}/release/${{ steps.package.outputs.name }}"
          ls -al "$BIN"
          strip -s "$BIN" || true
          # Ensure cargo-generate-rpm's asset path exists without copying the file
          mkdir -p target/release
          ln -sf "../${{ matrix.target }}/release/${{ steps.package.outputs.name }}" "target/release/${{ steps.package.outputs.name }}"
          ls -al target/release/${{ steps.package.outputs.name }}

      - name: Generate RPM
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo generate-rpm
          RPM_PATH="$(find target/generate-rpm -type f -name '*.rpm' -print -quit)"
          echo "RPM_ASSET=$RPM_PATH" >> $GITHUB_ENV
          echo "RPM: $RPM_PATH"

      - name: Generate DEB (musl static)
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo deb --no-build
          DEB_PATH="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          echo "DEB_ASSET=$DEB_PATH" >> $GITHUB_ENV
          echo "DEB: $DEB_PATH"

      # Non-Linux builds (macOS, Windows)
      - name: Build
        if: "!startsWith(matrix.build, 'linux')"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          binary_name="${{ steps.package.outputs.name }}"
          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname"
          else
            mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
            echo "ASSET=$dirname.zip" >> $GITHUB_ENV
          else
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "ASSET=$dirname.tar.gz" >> $GITHUB_ENV
          fi

      - name: Collect the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for asset in "${ASSET}" "${RPM_ASSET:-}" "${DEB_ASSET:-}"; do
            [[ -z "${asset}" ]] || cp "${asset}" dist/
          done
          ls -al dist

      # The release tag publishes exactly these files, downloaded from this run.
      - name: Upload the release assets
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.build }}
          path: dist/*
          if-no-files-found: error

  # The crate a release uploads is built from source by crates.io; the dry run
  # proves it packages and builds before anything is released.
  crate-check:
    name: Crate dry run
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.kind != 'release'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - run: cargo publish --dry-run --locked

  # Only release tags (X.Y.Z) that passed the guard publish, and only the artifacts
  # of their candidate run: nothing is rebuilt after CI.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.kind == 'release'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the candidate run's assets
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Check the assets carry the release version
        shell: bash
        run: |
          set -euo pipefail
          ls -al dist
          for asset in dist/*; do
            if [[ "$(basename "${asset}")" != *"${{ needs.guard.outputs.version }}"* ]]; then
              echo "::error::${asset} does not carry version ${{ needs.guard.outputs.version }}."
              exit 1
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: dist/*

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - guard
      - release
    # Only release tags (X.Y.Z) that passed the guard publish to crates.io. Safe to
    # re-run: a version crates.io already has is skipped, not uploaded twice.
    if: github.event_name == 'push' && needs.guard.outputs.kind == 'release'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        shell: bash
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          crate="$(awk -F'"' '/^name = /{print $2; exit}' Cargo.toml)"
          if curl -sf -o /dev/null -A "${crate}-release" "https://crates.io/api/v1/crates/${crate}/${VERSION}"; then
            echo "${crate} ${VERSION} is already on crates.io; nothing to publish."
            exit 0
          fi
          cargo publish --locked --token "${CRATES_TOKEN}"
