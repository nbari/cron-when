---
name: Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Classifies the ref for the jobs below: `release` for an X.Y.Z tag, `test-tag` for
  # any other tag (t-* from `just t-deploy` only tests and builds), `dispatch` for a
  # manual run. A release tag may only publish (GitHub release, crates.io) a commit
  # that is already on main and has a successful push-triggered "Test & Build" run,
  # which is what `just deploy` guarantees; a hand-pushed or stray tag stops here.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify the ref
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          kind=dispatch
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            kind=test-tag
            if [[ "${GITHUB_REF#refs/tags/}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              kind=release
            fi
          fi
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "Ref ${GITHUB_REF} classified as ${kind}."

      - name: Require the tagged commit to be on main and to have passed Test & Build
        if: steps.classify.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${tag} points at ${GITHUB_SHA}, which is not on main; refusing to release."
            exit 1
          fi
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build.yml \
            --commit "${GITHUB_SHA}" --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${passed}" ]]; then
            echo "::error::${GITHUB_SHA} has no successful Test & Build run; refusing to release ${tag}."
            exit 1
          fi
          echo "Tag ${tag}: ${GITHUB_SHA} is on main and passed Test & Build (run ${passed})."

  test:
    needs: guard
    uses: ./.github/workflows/test.yml

  containers:
    needs: guard
    uses: ./.github/workflows/containers.yml

  build:
    name: Build and release
    runs-on: ${{ matrix.os }}
    needs:
      - guard
      - test
      - containers

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get package name from Cargo.toml
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(awk -F '"' '/^name = / {print $2; exit}' Cargo.toml)
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Package name: $PACKAGE_NAME"

      - name: Get the release version from the tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux-only prerequisites
      - name: Install system deps (musl)
        if: startsWith(matrix.build, 'linux')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-dev musl-tools

      - name: Install packaging tools (RPM/DEB)
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo install cargo-generate-rpm
          cargo install cargo-deb --force --locked

      # Build once for Linux (musl)
      - name: Build Linux (musl)
        if: startsWith(matrix.build, 'linux')
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Strip once and prep paths for both packagers
      - name: Strip and prepare packaging paths (Linux)
        if: startsWith(matrix.build, 'linux')
        run: |
          BIN="target/${{ matrix.target }}/release/${{ steps.package.outputs.name }}"
          ls -al "$BIN"
          strip -s "$BIN" || true
          # Ensure cargo-generate-rpm's asset path exists without copying the file
          mkdir -p target/release
          ln -sf "../${{ matrix.target }}/release/${{ steps.package.outputs.name }}" "target/release/${{ steps.package.outputs.name }}"
          ls -al target/release/${{ steps.package.outputs.name }}

      - name: Generate RPM
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo generate-rpm
          RPM_PATH="$(find target/generate-rpm -type f -name '*.rpm' -print -quit)"
          echo "RPM_ASSET=$RPM_PATH" >> $GITHUB_ENV
          echo "RPM: $RPM_PATH"

      - name: Generate DEB (musl static)
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo deb --no-build
          DEB_PATH="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          echo "DEB_ASSET=$DEB_PATH" >> $GITHUB_ENV
          echo "DEB: $DEB_PATH"

      # Non-Linux builds (macOS, Windows)
      - name: Build
        if: "!startsWith(matrix.build, 'linux')"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          binary_name="${{ steps.package.outputs.name }}"
          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname"
          else
            mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
            echo "ASSET=$dirname.zip" >> $GITHUB_ENV
          else
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "ASSET=$dirname.tar.gz" >> $GITHUB_ENV
          fi

      # Only release tags (X.Y.Z) publish; see the guard job
      - name: Release
        if: needs.guard.outputs.kind == 'release'
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |-
            ${{ env.ASSET }}
            ${{ env.RPM_ASSET }}
            ${{ env.DEB_ASSET }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - guard
      - build
    # Only release tags (X.Y.Z) that passed the guard publish to crates.io
    if: github.event_name == 'push' && needs.guard.outputs.kind == 'release'
    continue-on-error: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - run: cargo publish --token ${CRATES_TOKEN}
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
