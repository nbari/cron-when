---
name: Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# Read-only by default: only the GitHub release job writes to the repository.
permissions:
  contents: read

jobs:
  # Classifies the run for the jobs below.
  # - `candidate`: a manual (workflow_dispatch) run on a branch, which `just deploy`
  #   starts on the release candidate before any tag exists. It runs the whole
  #   pipeline (tests, every build and package, the crate packaged and verified) and
  #   keeps the artifacts plus a manifest of their SHA-256 sums, publishing nothing.
  # - `release`: a pushed X.Y.Z tag. It builds nothing. The signed tag names its
  #   candidate run; the guard checks that run and the tag's commit, and the jobs
  #   below publish exactly the manifest's files, so what ships is what was tested.
  # - `test-tag`: any other tag, or a manual run on a tag (e.g. t-* from
  #   `just t-deploy`): tests and builds only.
  # A release tag may only publish a commit that is on main, carries the tag's version
  # and passed Test & Build and its candidate run; a hand-pushed or stray tag stops here.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      version: ${{ steps.classify.outputs.version }}
      candidate_run: ${{ steps.release.outputs.candidate_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify the run
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [[ "${EVENT}" == workflow_dispatch && "${GITHUB_REF}" == refs/heads/* ]]; then
            kind=candidate
          elif [[ "${EVENT}" == push && "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind=release
          else
            kind=test-tag
            # Test builds are named after the ref; only safe characters reach file names.
            version="test"
            if [[ "${GITHUB_REF_NAME}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              version="${GITHUB_REF_NAME}"
            fi
          fi
          if [[ "${kind}" != test-tag && ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml has no X.Y.Z version (found '${version}')."
            exit 1
          fi
          {
            echo "kind=${kind}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "${EVENT} on ${GITHUB_REF} classified as ${kind} (version ${version})."

      - name: Require the tag's commit, version, Test & Build run and candidate run
        id: release
        if: steps.classify.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${tag} points at ${GITHUB_SHA}, which is not on main; refusing to release."
            exit 1
          fi
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [[ "${version}" != "${tag}" ]]; then
            echo "::error::Tag ${tag} does not match the package version ${version} at ${GITHUB_SHA}; refusing to release."
            exit 1
          fi
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build.yml \
            --commit "${GITHUB_SHA}" --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${passed}" ]]; then
            echo "::error::${GITHUB_SHA} has no successful Test & Build run; refusing to release ${tag}."
            exit 1
          fi
          # The signed tag names the candidate run whose artifacts it releases.
          read -r type object <<<"$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '"\(.object.type) \(.object.sha)"')"
          if [[ "${type}" != tag ]]; then
            echo "::error::${tag} is not an annotated tag; refusing to release."
            exit 1
          fi
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object}" --jq '.verification.verified')"
          message="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object}" --jq '.message')"
          if [[ "${verified}" != true ]]; then
            echo "::error::The signature of tag ${tag} is not verified by GitHub; refusing to release."
            exit 1
          fi
          candidate_run="$(sed -n 's/^Candidate run: \([0-9][0-9]*\)$/\1/p' <<<"${message}" | head -n 1)"
          if [[ -z "${candidate_run}" ]]; then
            echo "::error::Tag ${tag} names no candidate run; refusing to publish untested artifacts."
            exit 1
          fi
          read -r head_sha event conclusion path <<<"$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run}" \
            --jq '"\(.head_sha) \(.event) \(.conclusion) \(.path)"')"
          if [[ "${head_sha}" != "${GITHUB_SHA}" || "${event}" != workflow_dispatch || "${conclusion}" != success || "${path}" != .github/workflows/release.yml* ]]; then
            echo "::error::Run ${candidate_run} is not a successful candidate run of ${GITHUB_SHA} (${head_sha} ${event} ${conclusion} ${path})."
            exit 1
          fi
          echo "candidate_run=${candidate_run}" >> "$GITHUB_OUTPUT"
          echo "Tag ${tag}: ${GITHUB_SHA} is on main, passed Test & Build (run ${passed}) and candidate run ${candidate_run}."

  # A release tag reuses its candidate run's results, so it neither tests nor builds.
  test:
    needs: guard
    if: needs.guard.outputs.kind != 'release'
    uses: ./.github/workflows/test.yml

  containers:
    needs: guard
    if: needs.guard.outputs.kind != 'release'
    uses: ./.github/workflows/containers.yml

  build:
    name: Build and package
    runs-on: ${{ matrix.os }}
    needs:
      - guard
      - test
      - containers
    if: needs.guard.outputs.kind != 'release'
    env:
      VERSION: ${{ needs.guard.outputs.version }}

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get package name from Cargo.toml
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(awk -F '"' '/^name = / {print $2; exit}' Cargo.toml)
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Package name: $PACKAGE_NAME"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux-only prerequisites
      - name: Install system deps (musl)
        if: startsWith(matrix.build, 'linux')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-dev musl-tools

      - name: Install packaging tools (RPM/DEB)
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo install cargo-generate-rpm
          cargo install cargo-deb --force --locked

      # Build once for Linux (musl)
      - name: Build Linux (musl)
        if: startsWith(matrix.build, 'linux')
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Strip once and prep paths for both packagers
      - name: Strip and prepare packaging paths (Linux)
        if: startsWith(matrix.build, 'linux')
        run: |
          BIN="target/${{ matrix.target }}/release/${{ steps.package.outputs.name }}"
          ls -al "$BIN"
          strip -s "$BIN" || true
          # Ensure cargo-generate-rpm's asset path exists without copying the file
          mkdir -p target/release
          ln -sf "../${{ matrix.target }}/release/${{ steps.package.outputs.name }}" "target/release/${{ steps.package.outputs.name }}"
          ls -al target/release/${{ steps.package.outputs.name }}

      - name: Generate RPM
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo generate-rpm
          RPM_PATH="$(find target/generate-rpm -type f -name '*.rpm' -print -quit)"
          echo "RPM_ASSET=$RPM_PATH" >> $GITHUB_ENV
          echo "RPM: $RPM_PATH"

      - name: Generate DEB (musl static)
        if: startsWith(matrix.build, 'linux')
        run: |
          cargo deb --no-build
          DEB_PATH="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          echo "DEB_ASSET=$DEB_PATH" >> $GITHUB_ENV
          echo "DEB: $DEB_PATH"

      # Non-Linux builds (macOS, Windows)
      - name: Build
        if: "!startsWith(matrix.build, 'linux')"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          binary_name="${{ steps.package.outputs.name }}"
          dirname="$binary_name-${VERSION}-${{ matrix.target }}"
          mkdir "$dirname"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname"
          else
            mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
            echo "ASSET=$dirname.zip" >> $GITHUB_ENV
          else
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "ASSET=$dirname.tar.gz" >> $GITHUB_ENV
          fi

      - name: Collect the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for asset in "${ASSET}" "${RPM_ASSET:-}" "${DEB_ASSET:-}"; do
            [[ -z "${asset}" ]] || cp "${asset}" dist/
          done
          ls -al dist

      # The release tag publishes exactly these files, downloaded from this run.
      - name: Upload the release assets
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.build }}
          path: dist/*
          if-no-files-found: error

  # Package the crate once, with cargo's verification build, and keep it: the release
  # uploads the same bytes (cargo packaging is reproducible with the same toolchain)
  # without building again.
  crate:
    name: Crate package
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.kind != 'release'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package and verify the crate
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          mkdir crate
          cp target/package/*.crate crate/
          rustc --version | awk '{print $2}' > crate/rust-version
          ls -al crate
          cat crate/rust-version

      - name: Upload the crate
        uses: actions/upload-artifact@v7
        with:
          name: crate
          path: crate/*
          if-no-files-found: error

  # The candidate's manifest: the SHA-256 of every release file and of the crate, the
  # version, the commit, the toolchain and the artifacts the release needs. `just
  # deploy` checks it and those artifacts before tagging, and the release publishes
  # exactly the files it lists.
  manifest:
    name: Release manifest
    runs-on: ubuntu-latest
    needs:
      - guard
      - build
      - crate
    if: needs.guard.outputs.kind == 'candidate'
    steps:
      - name: Download this run's assets
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: artifacts

      - name: Download this run's crate
        uses: actions/download-artifact@v8
        with:
          name: crate
          path: crate

      # Every build of the matrix must be here with all its files, so a lost artifact
      # can never produce a partial release. Keep this in step with the build matrix.
      - name: Check the inventory
        shell: bash
        env:
          EXPECTED: dist-linux=3 dist-linux-arm64=3 dist-macos=1 dist-windows=1
        run: |
          set -euo pipefail
          for entry in ${EXPECTED}; do
            name="${entry%=*}"
            count="$(find "artifacts/${name}" -maxdepth 1 -type f 2>/dev/null | wc -l)"
            if [[ "${count}" -ne "${entry#*=}" ]]; then
              echo "::error::Artifact ${name} has ${count} files, expected ${entry#*=}."
              exit 1
            fi
          done
          actual="$(find artifacts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')"
          wanted="$(for entry in ${EXPECTED}; do echo "${entry%=*}"; done | sort | tr '\n' ' ')"
          if [[ "${actual}" != "${wanted}" ]]; then
            echo "::error::Found artifacts ${actual}, expected ${wanted}."
            exit 1
          fi

      - name: Write the manifest
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          EXPECTED: dist-linux=3 dist-linux-arm64=3 dist-macos=1 dist-windows=1
        run: |
          set -euo pipefail
          mkdir dist manifest
          find artifacts -type f -exec cp -n {} dist/ \;
          (cd dist && sha256sum -- *) > manifest/SHA256SUMS
          if [[ "$(wc -l < manifest/SHA256SUMS)" -ne 8 ]]; then
            echo "::error::Expected 8 release files (a name collision?), got $(wc -l < manifest/SHA256SUMS)."
            exit 1
          fi
          (cd crate && sha256sum -- *.crate) > manifest/CRATE.SHA256
          {
            echo "VERSION=${VERSION}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "RUST=$(cat crate/rust-version)"
          } > manifest/release.env
          # The artifacts the release publishes from; just deploy checks they all remain.
          { for entry in ${EXPECTED}; do echo "${entry%=*}"; done; echo crate; } > manifest/ARTIFACTS
          cat manifest/*

      - name: Upload the manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: manifest/*
          if-no-files-found: error

  # Only release tags (X.Y.Z) that passed the guard publish, and only the files of
  # their candidate run's manifest: nothing is rebuilt after CI. Safe to re-run: the
  # release is updated in place and existing assets are overwritten.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.kind == 'release'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the candidate run's manifest
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          name: release-manifest
          path: manifest

      - name: Download the candidate run's assets
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Check the assets against the manifest
        shell: bash
        env:
          TAG_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          . manifest/release.env
          if [[ "${VERSION}" != "${TAG_VERSION}" || "${COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "::error::The candidate manifest is for ${VERSION} at ${COMMIT}, not ${TAG_VERSION} at ${GITHUB_SHA}."
            exit 1
          fi
          listed="$(awk '{print $2}' manifest/SHA256SUMS | sort)"
          present="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "${listed}" != "${present}" ]]; then
            echo "::error::The downloaded assets do not match the manifest."
            diff <(echo "${listed}") <(echo "${present}") || true
            exit 1
          fi
          (cd dist && sha256sum -c ../manifest/SHA256SUMS)
          cp manifest/SHA256SUMS dist/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: dist/*

  # Upload the crate the candidate run packaged and verified, after the GitHub release.
  # The candidate's toolchain repackages it without building (cargo packaging is
  # reproducible), and it is only uploaded when the checksum matches the manifest.
  # Safe to re-run: a version crates.io already has is accepted only with that checksum.
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - guard
      - release
    if: github.event_name == 'push' && needs.guard.outputs.kind == 'release'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Download the candidate run's manifest
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          name: release-manifest
          path: manifest

      - name: Read the manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          . manifest/release.env
          echo "rust=${RUST}" >> "$GITHUB_OUTPUT"

      - name: Install the candidate's toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.manifest.outputs.rust }}

      - name: Publish to crates.io
        shell: bash
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          crate="$(awk -F'"' '/^name = /{print $2; exit}' Cargo.toml)"
          expected="$(awk '{print $1}' manifest/CRATE.SHA256)"
          registry() {
            curl -sf -A "${crate}-release" "https://crates.io/api/v1/crates/${crate}/${VERSION}" | jq -r '.version.checksum // empty' || true
          }
          existing="$(registry)"
          if [[ -n "${existing}" ]]; then
            if [[ "${existing}" != "${expected}" ]]; then
              echo "::error::crates.io already has ${crate} ${VERSION} with checksum ${existing}, not the candidate's ${expected}."
              exit 1
            fi
            echo "${crate} ${VERSION} is already on crates.io with the candidate's checksum; nothing to publish."
            exit 0
          fi
          cargo package --no-verify --locked
          actual="$(sha256sum "target/package/${crate}-${VERSION}.crate" | awk '{print $1}')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Repackaged crate checksum ${actual} differs from the candidate's ${expected}; not publishing."
            exit 1
          fi
          cargo publish --no-verify --locked --token "${CRATES_TOKEN}"
          for _ in $(seq 30); do
            if [[ "$(registry)" == "${expected}" ]]; then
              echo "crates.io has ${crate} ${VERSION} with checksum ${expected}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::crates.io does not report ${crate} ${VERSION} with checksum ${expected} yet."
          exit 1
