---
name: Release

# The operator dispatches the tested develop commit with just release.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of the tested develop commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      package: ${{ steps.check.outputs.package }}
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the package name and version
        id: info
        uses: ./.github/actions/crate-info

      - name: Check the commit can be released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          INFO_NAME: ${{ steps.info.outputs.name }}
          INFO_VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/develop || "$GITHUB_SHA" != "$EXPECTED_SHA" ||
                "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::Dispatch on develop with its expected SHA. If develop moved, check CI again."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::Develop must contain main before releasing."
            exit 1
          fi
          bash .github/scripts/check-release-version.sh "$INFO_VERSION"
          bash .github/scripts/ci-ok-status.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          {
            echo "version=$INFO_VERSION"
            echo "package=$INFO_NAME"
          } >> "$GITHUB_OUTPUT"

      # `stable` moves every few weeks and "Re-run failed jobs" can run a leg hours later, so
      # it is resolved once here: every job of this run installs exactly this version, and a
      # re-run keeps this job's output. Nothing in the repository has to be bumped.
      - name: Resolve the Rust toolchain for this run
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          version="$(rustc +stable --version | awk '{print $2}')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve stable to an exact version (got '${version}')."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "This release is built with Rust ${version}."

  build:
    name: Build and package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: guard
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - build: linux
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        id: build
        uses: ./.github/actions/build-binary
        with:
          target: ${{ matrix.target }}
          toolchain: ${{ needs.guard.outputs.rust }}

      # Strips the binary too, so the archive holds the same binary as the packages.
      - name: Package RPM and DEB
        if: matrix.build == 'linux'
        uses: ./.github/actions/linux-packages
        with:
          target: ${{ matrix.target }}
          package: ${{ steps.build.outputs.name }}

      - name: Package the archive
        shell: bash
        env:
          PACKAGE: ${{ steps.build.outputs.name }}
          TARGET: ${{ matrix.target }}
          BUILD: ${{ matrix.build }}
        run: |
          set -euo pipefail
          mkdir -p dist
          dirname="${PACKAGE}-${VERSION}-${TARGET}"
          mkdir "${dirname}"
          if [[ "${BUILD}" == windows ]]; then
            cp "target/${TARGET}/release/${PACKAGE}.exe" "${dirname}/"
            7z a "dist/${dirname}.zip" "${dirname}"
          else
            cp "target/${TARGET}/release/${PACKAGE}" "${dirname}/"
            tar -czf "dist/${dirname}.tar.gz" "${dirname}"
          fi

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          overwrite: true
          if-no-files-found: error

  crate:
    name: Package the crate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: guard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ needs.guard.outputs.rust }}

      - name: Package and verify the crate
        run: cargo package --locked

      - name: Check crates.io would accept it
        run: cargo publish --dry-run --locked

      - name: Upload the crate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-crate
          path: target/package/${{ needs.guard.outputs.package }}-${{ needs.guard.outputs.version }}.crate
          overwrite: true
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - guard
      - build
      - crate
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      crate_checksum: ${{ steps.publish.outputs.crate_checksum }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      PACKAGE: ${{ needs.guard.outputs.package }}
      RUST: ${{ needs.guard.outputs.rust }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: incoming

      # An immutable release cannot be completed later, so the file set is checked first.
      # Keep this list in step with the build matrix: a missing or extra file stops the release.
      - name: Check the release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          shopt -s nullglob dotglob
          for file in incoming/dist-*/*; do
            name=${file##*/}
            if [[ ! -f "$file" || -L "$file" || -e "dist/$name" ]]; then
              echo "::error::Invalid or duplicate release file: $file"
              exit 1
            fi
            mv -- "$file" "dist/$name"
          done
          expected="$(
            {
              for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
                echo "${PACKAGE}-${VERSION}-${target}.tar.gz"
              done
              echo "${PACKAGE}-${VERSION}-x86_64-pc-windows-msvc.zip"
              echo "${PACKAGE}-${VERSION}.crate"
              echo "${PACKAGE}_${VERSION}-1_amd64.deb"
              echo "${PACKAGE}_${VERSION}-1_arm64.deb"
              echo "${PACKAGE}-${VERSION}-1.x86_64.rpm"
              echo "${PACKAGE}-${VERSION}-1.aarch64.rpm"
            } | sort
          )"
          actual="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::The built files differ from the expected set."
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      # Generate release notes from commit subjects, excluding version bump commits.
      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude "$VERSION" "$GITHUB_SHA" 2>/dev/null || true)"
          range="$GITHUB_SHA"
          [[ -z "${previous}" ]] || range="${previous}..${GITHUB_SHA}"
          changes="$(git log --no-merges --format='- %s (%h)' "${range}" | grep -viE '^- bump version to [0-9]+\.[0-9]+\.[0-9]+ ' || true)"
          {
            echo "## Changes"
            echo
            echo "${changes:-- Only the version bump.}"
            if [[ -n "${previous}" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${VERSION}"
            fi
            echo
            echo "## Verify a download"
            echo
            echo '```sh'
            echo 'sha256sum --check --ignore-missing SHA256SUMS'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo '```'
            echo
            echo "Built from \`${GITHUB_SHA}\` with Rust ${RUST}."
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Publish and verify the GitHub release
        id: publish
        run: bash .github/scripts/github-release.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [guard, release]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PACKAGE: ${{ needs.guard.outputs.package }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*-unknown-linux-musl
          merge-multiple: true
          path: dist

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Stage and verify the image
        id: stage
        run: bash .github/container/stage-release.sh

      - name: Attest the image index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true

      - name: Publish or verify the version tag
        env:
          IMAGE: ${{ steps.stage.outputs.image }}
          DIGEST: ${{ steps.stage.outputs.digest }}
          PUBLISH: ${{ steps.stage.outputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          fi
          actual="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -er .digest)"
          [[ "$actual" == "$DIGEST" ]] || { echo "::error::$IMAGE:$VERSION points to $actual, expected $DIGEST."; exit 1; }
          printf "Image \`%s:%s\`\n\nPinned reference \`%s@%s\`\n" "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - guard
      - release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      PACKAGE: ${{ needs.guard.outputs.package }}
      CRATE_CHECKSUM: ${{ needs.release.outputs.crate_checksum }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the registry checksum before uploading
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CRATE_CHECKSUM" =~ ^[0-9a-f]{64}$ ]]
          held="$(bash .github/scripts/crates-io-checksum.sh "$PACKAGE" "$VERSION")"
          case "$held" in
            "$CRATE_CHECKSUM")
              echo "$PACKAGE $VERSION already has the verified checksum."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            absent) ;;
            *) echo "::error::crates.io already holds $PACKAGE $VERSION with different bytes."; exit 1 ;;
          esac

      - name: Install Rust
        if: steps.exists.outputs.published != 'true'
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ needs.guard.outputs.rust }}

      # Short-lived token from crates.io Trusted Publishing; no registry secret is stored.
      - name: Get a crates.io token
        id: auth
        if: steps.exists.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Publish
        if: steps.exists.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify

      - name: Verify the uploaded crate
        if: steps.exists.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if held="$(bash .github/scripts/crates-io-checksum.sh "$PACKAGE" "$VERSION")" &&
               [[ "$held" != absent ]]; then
              [[ "$held" == "$CRATE_CHECKSUM" ]] || {
                echo "::error::crates.io holds $PACKAGE $VERSION with different bytes."
                exit 1
              }
              echo "Verified the crates.io checksum for $PACKAGE $VERSION."
              exit 0
            fi
            if (( attempt < 10 )); then sleep 6; fi
          done
          echo "::error::The crates.io checksum is unavailable. Re-run this job to verify the upload."
          exit 1
